name: Apply Mailgun email fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'fix: use Mailgun HTTPS for email') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app.py and render.yaml
        shell: python
        run: |
          from pathlib import Path
          import re
          import py_compile

          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          pattern = re.compile(r'def send_email\(to_email, subject, body, html=None\):.*?\n\napp = Flask\(__name__\)', re.S)
          replacement = '''def send_email(to_email, subject, body, html=None):
              """Send mail through Mailgun HTTPS API.

              Render Free blocks outbound SMTP ports, so OTP and other email
              use HTTPS instead of smtplib.
              """
              if not to_email:
                  return False

              try:
                  import requests

                  api_key = os.environ.get("MAILGUN_API_KEY", "").strip()
                  domain = os.environ.get("MAILGUN_DOMAIN", "").strip()
                  base_url = os.environ.get(
                      "MAILGUN_BASE_URL", "https://api.mailgun.net"
                  ).rstrip("/")
                  mail_from = os.environ.get("MAIL_FROM", "").strip()

                  if not api_key or not domain:
                      logger.error(
                          "Mailgun configuration missing: "
                          "MAILGUN_API_KEY or MAILGUN_DOMAIN"
                      )
                      return False

                  if not mail_from:
                      mail_from = f"Mailgun Sandbox <postmaster@{domain}>"

                  data = {
                      "from": mail_from,
                      "to": to_email,
                      "subject": subject,
                      "text": body,
                  }
                  if html:
                      data["html"] = html

                  response = requests.post(
                      f"{base_url}/v3/{domain}/messages",
                      auth=("api", api_key),
                      data=data,
                      timeout=20,
                  )
                  response.raise_for_status()

                  logger.info("Email sent successfully via Mailgun to %s", to_email)
                  return True
              except Exception:
                  logger.exception("Mailgun email sending failed")
                  return False

          app = Flask(__name__)'''

          if not pattern.search(s):
              raise SystemExit('Could not locate send_email block; no changes made')
          s = pattern.sub(replacement, s, count=1)
          p.write_text(s, encoding='utf-8')

          py_compile.compile('app.py', doraise=True)

          r = Path('render.yaml')
          if r.exists():
              rs = r.read_text(encoding='utf-8')
              for key in ('SMTP_HOST', 'SMTP_PORT', 'SMTP_USER', 'SMTP_PASSWORD'):
                  rs = re.sub(rf'\n\s*- key: {key}\n\s*(?:value:.*\n\s*)?sync: false', '', rs)
              if 'key: MAILGUN_API_KEY' not in rs:
                  marker = '      - key: MAIL_FROM\n        sync: false'
                  addition = ('\n      - key: MAILGUN_API_KEY\n        sync: false\n'
                              '      - key: MAILGUN_DOMAIN\n        sync: false\n'
                              '      - key: MAILGUN_BASE_URL\n        value: "https://api.mailgun.net"')
                  if marker in rs:
                      rs = rs.replace(marker, marker + addition, 1)
                  else:
                      rs = rs.replace('    envVars:\n', '    envVars:\n' + addition.lstrip('\n') + '\n', 1)
              r.write_text(rs, encoding='utf-8')

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py render.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: use Mailgun HTTPS for email"
          git push
