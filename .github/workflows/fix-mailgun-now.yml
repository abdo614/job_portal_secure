name: Fix email delivery with Mailgun

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'fix: use Mailgun HTTPS for email') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace SMTP sender with Mailgun HTTPS
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          start = text.find('def send_email(to_email, subject, body, html=None):')
          if start < 0:
              raise SystemExit('send_email definition not found')
          end = text.find('\napp = Flask(__name__)', start)
          if end < 0:
              raise SystemExit('end of send_email block not found')

          new_func = '''def send_email(to_email, subject, body, html=None):
    """Send email through Mailgun HTTPS API instead of SMTP.

    Render Free blocks outbound SMTP ports, so mail is sent over HTTPS.
    Required environment variables: MAILGUN_API_KEY and MAILGUN_DOMAIN.
    MAILGUN_BASE_URL defaults to https://api.mailgun.net.
    """
    if not to_email:
        return False

    try:
        import requests

        api_key = os.environ.get("MAILGUN_API_KEY", "").strip()
        domain = os.environ.get("MAILGUN_DOMAIN", "").strip()
        base_url = os.environ.get(
            "MAILGUN_BASE_URL", "https://api.mailgun.net"
        ).rstrip("/")

        if not api_key or not domain:
            logger.error(
                "Mailgun configuration missing: MAILGUN_API_KEY or MAILGUN_DOMAIN"
            )
            return False

        mail_from = os.environ.get("MAIL_FROM", "").strip()
        if not mail_from:
            mail_from = f"Mailgun Sandbox <postmaster@{domain}>"

        data = {
            "from": mail_from,
            "to": to_email,
            "subject": subject,
            "text": body,
        }
        if html:
            data["html"] = html

        response = requests.post(
            f"{base_url}/v3/{domain}/messages",
            auth=("api", api_key),
            data=data,
            timeout=20,
        )
        response.raise_for_status()

        logger.info("Email sent successfully via Mailgun to %s", to_email)
        return True
    except requests.RequestException as exc:
        logger.error("Mailgun email request failed: %s", exc)
        return False
    except Exception:
        logger.exception("Mailgun email sending failed")
        return False
'''

          text = text[:start] + new_func + text[end:]
          path.write_text(text, encoding='utf-8')

          render = Path('render.yaml')
          if render.exists():
              r = render.read_text(encoding='utf-8')
              r = re.sub(r'\n      - key: SMTP_HOST\n        sync: false', '', r)
              r = re.sub(r'\n      - key: SMTP_PORT\n        sync: false', '', r)
              r = re.sub(r'\n      - key: SMTP_USER\n        sync: false', '', r)
              r = re.sub(r'\n      - key: SMTP_PASSWORD\n        sync: false', '', r)
              if '      - key: MAILGUN_API_KEY\n' not in r:
                  marker = '      - key: MAIL_FROM\n        sync: false'
                  addition = '\n      - key: MAILGUN_API_KEY\n        sync: false\n      - key: MAILGUN_DOMAIN\n        sync: false\n      - key: MAILGUN_BASE_URL\n        value: "https://api.mailgun.net"'
                  r = r.replace(marker, marker + addition)
              render.write_text(r, encoding='utf-8')

      - name: Verify and commit
        shell: bash
        run: |
          python -m py_compile app.py
          grep -q 'MAILGUN_API_KEY' app.py
          ! grep -q 'smtplib.SMTP' app.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py render.yaml
          git commit -m 'fix: use Mailgun HTTPS for email'
          git push

      - name: Remove migration workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/fix-mailgun-now.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove Mailgun migration workflow'
          git push
