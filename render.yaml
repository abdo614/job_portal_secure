services:
  - type: web
    name: job-portal-secure
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_production.py
    healthCheckPath: /
    envVars:
      - key: FLASK_SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FLASK_HTTPS
        value: "1"