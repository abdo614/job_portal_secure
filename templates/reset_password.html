<!doctype html><html lang="{{ site_lang|default('ar') }}" dir="{{ site_dir|default('rtl') }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إعادة تعيين كلمة المرور | ArabJobs</title>
<style id="global-language-style">
.site-language-dropdown{position:fixed;top:12px;right:14px;z-index:100000;direction:ltr;font-family:inherit;color:#18364d}.site-language-trigger{display:flex;align-items:center;gap:9px;min-width:132px;height:44px;padding:0 12px;border:1px solid rgba(255,255,255,.22);border-radius:14px;background:linear-gradient(135deg,rgba(13,43,62,.97),rgba(28,74,105,.94));color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.20);backdrop-filter:blur(14px);cursor:pointer;transition:.2s ease;font:700 12px/1 inherit}.site-language-trigger:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(0,0,0,.24)}.lang-trigger-icon{font-size:18px;line-height:1}.lang-trigger-copy{display:flex;flex:1;flex-direction:column;align-items:flex-start;min-width:0}.lang-trigger-copy small{font-size:9px;opacity:.65;line-height:1.1}.lang-trigger-copy strong{font-size:12px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lang-chevron{font-size:10px;opacity:.75;transition:transform .18s ease}.site-language-dropdown.open .lang-chevron{transform:rotate(180deg)}.site-language-menu{display:none;position:absolute;top:50px;right:0;width:248px;padding:9px;background:rgba(255,255,255,.98);border:1px solid rgba(19,55,78,.10);border-radius:18px;box-shadow:0 22px 55px rgba(0,0,0,.22);overflow:hidden}.site-language-dropdown.open .site-language-menu{display:block;animation:langMenuIn .16s ease-out}@keyframes langMenuIn{from{opacity:0;transform:translateY(-5px) scale(.98)}to{opacity:1;transform:none}}.lang-menu-head{display:flex;gap:10px;align-items:center;padding:6px 8px 9px}.lang-menu-head>span{font-size:23px}.lang-menu-head div{display:flex;flex-direction:column}.lang-menu-head strong{font-size:13px}.lang-menu-head small{font-size:10px;color:#7a8795;margin-top:2px}.lang-search-wrap{display:flex;align-items:center;gap:8px;margin:0 2px 8px;padding:0 10px;height:36px;border:1px solid #e5eaf0;border-radius:11px;background:#f8fafc;color:#8794a3}.lang-search-wrap input{width:100%;border:0;outline:0;background:transparent;color:#19364b;font:600 12px/1 inherit}.lang-search-wrap:focus-within{border-color:#7aaed4;box-shadow:0 0 0 3px rgba(58,130,184,.10)}.lang-options{max-height:300px;overflow:auto;padding-right:2px}.site-language-option{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:transparent;color:#18364d;padding:10px;border-radius:12px;cursor:pointer;font:600 12px/1.2 inherit;text-align:left;transition:.15s ease}.site-language-option:hover{background:#f3f7fb;transform:translateX(-1px)}.site-language-option.active{background:linear-gradient(90deg,#eaf4fb,#f6fbfe);color:#134b70;font-weight:800}.site-language-option .lang-option-main{display:flex;align-items:center;gap:10px}.site-language-option .lang-flag{width:25px;text-align:center;font-size:19px}.lang-option-copy{display:flex;flex-direction:column;align-items:flex-start;gap:2px}.lang-option-copy strong{font-size:12px}.lang-option-copy small{font-size:9px;color:#7f8d9b}.site-language-option .lang-check{color:#1671a8;opacity:0;transition:.15s ease}.site-language-option.active .lang-check{opacity:1}.site-language-option:disabled{opacity:.55;cursor:wait}.site-language-option[hidden]{display:none}html[dir="rtl"] .site-language-dropdown{left:14px;right:auto}html[dir="rtl"] .site-language-menu{left:0;right:auto}@media(max-width:700px){.site-language-dropdown{top:8px;right:8px}.site-language-trigger{min-width:118px;height:40px}.site-language-menu{width:220px}html[dir="rtl"] .site-language-dropdown{left:8px;right:auto}}
</style><style>body{margin:0;font-family:Tahoma,Arial;background:linear-gradient(135deg,#eef5ff,#f8fafc);min-height:100vh;display:grid;place-items:center}.card{width:min(460px,90%);background:#fff;border:1px solid #e6eaf0;border-radius:22px;padding:32px;box-shadow:0 18px 55px #1232}.brand{font-size:30px;font-weight:900;color:#1769aa}.muted{color:#687386;line-height:1.8}.password-wrap{position:relative;margin-top:11px}.password-wrap input{width:100%;box-sizing:border-box;padding:14px 50px 14px 14px;border-radius:12px;font-size:15px;border:1px solid #d9e0e8;margin:0;direction:ltr;text-align:left}.toggle-password{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;margin:0;padding:0;border:0;background:transparent;color:#667085;cursor:pointer;font-size:18px}.toggle-password:focus-visible{outline:2px solid #1769aa;border-radius:8px}.submit-btn{width:100%;box-sizing:border-box;padding:14px;margin-top:11px;border-radius:12px;font-size:15px;border:0;background:#1769aa;color:#fff;font-weight:800;cursor:pointer}.ok{color:#16734a}.err{color:#b42318}</style><script>window.__SITE_LANG__ = {{ site_lang|default("ar")|tojson }}; window.__SITE_LANGUAGES__ = {{ site_languages|default({})|tojson }}; window.__SITE_I18N__ = {{ i18n_dictionary|default({})|tojson }};</script><script src="/static/js/site-i18n.js" defer></script></head><body><div class="card"><div class="brand">🎉 ArabJobs</div><h2>إعادة تعيين كلمة المرور</h2><p class="muted">أنشئ كلمة مرور جديدة لحسابك. يجب أن تكون 8 أحرف على الأقل.</p><div class="password-wrap"><input id="p" type="password" placeholder="كلمة المرور الجديدة" autocomplete="new-password"><button type="button" class="toggle-password" data-target="p" aria-label="إظهار كلمة المرور" aria-pressed="false">👁️</button></div><div class="password-wrap"><input id="p2" type="password" placeholder="تأكيد كلمة المرور" autocomplete="new-password"><button type="button" class="toggle-password" data-target="p2" aria-label="إظهار تأكيد كلمة المرور" aria-pressed="false">👁️</button></div><button class="submit-btn" onclick="go()">حفظ كلمة المرور</button><p id="m"></p></div>
<script>document.querySelectorAll('.toggle-password').forEach(btn=>btn.addEventListener('click',()=>{const input=document.getElementById(btn.dataset.target);const show=input.type==='password';input.type=show?'text':'password';btn.textContent=show?'🙈':'👁️';btn.setAttribute('aria-pressed',String(show));btn.setAttribute('aria-label',show?'إخفاء كلمة المرور':'إظهار كلمة المرور');input.focus();}));async function go(){const m=document.getElementById('m'),p=document.getElementById('p').value,p2=document.getElementById('p2').value;if(p!==p2){m.className='err';m.textContent='كلمتا المرور غير متطابقتين.';return}if(p.length<8){m.className='err';m.textContent='كلمة المرور يجب أن تكون 8 أحرف على الأقل.';return}const token=new URLSearchParams(location.search).get('token');try{const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})});const d=await r.json();m.className=d.success?'ok':'err';m.textContent=d.message||d.error||'حدث خطأ';}catch(e){m.className='err';m.textContent='تعذر الاتصال بالخادم.'}}</script></body></html>
