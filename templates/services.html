<!doctype html><html lang="{{ site_lang|default("en") }}" dir="{{ site_dir|default("ltr") }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخدمات</title><style>body{font-family:Tajawal,Arial,sans-serif;margin:0;background:#f5f7fa;color:#172333}.wrap{max-width:1100px;margin:auto;padding:35px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 20px #0001}.top{background:#102f45;color:#fff;padding:18px}.top a{color:#fff;margin-left:15px;text-decoration:none}</style><style>.site-logo-white,.logo h1,.logo span{color:#fff!important;text-decoration:none}</style><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/static/css/header.css">
</head><body>
{% include 'header.html' %}<main class="wrap"><h1>الخدمات</h1><div id="list" class="grid"></div></main><script>fetch('/api/content/services').then(r=>r.json()).then(d=>document.getElementById('list').innerHTML=(d||[]).filter(x=>x.enabled!==false).map(x=>`<article class="card" style="text-align:center"><div style="width:60px;height:60px;margin:0 auto 14px;background:#eaf4ff;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#1769aa;font-size:26px"><i class="fa ${x.icon||'fa-cog'}"></i></div><h2 style="margin:0 0 10px">${x.title||x.name||''}</h2><p style="color:#687386;line-height:1.7;margin:0">${x.description||x.desc||x.content||''}</p></article>`).join(''))</script>
</body></html>
