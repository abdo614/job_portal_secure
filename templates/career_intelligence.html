<!doctype html><html lang="{{ site_lang|default('ar') }}" dir="{{ site_dir|default('rtl') }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الذكاء المهني - ArabJobs</title><link rel="stylesheet" href="/static/css/header.css"><style>body{margin:0;background:#f5f7fb;font-family:Tahoma,Arial;color:#172033}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:18px;padding:22px;box-shadow:0 8px 28px #1720330d}.hero{background:#102f45;color:#fff;border-radius:20px;padding:28px;margin-bottom:18px}.item{padding:12px;margin:8px 0;border:1px solid #e8edf3;border-radius:12px}.score{font-weight:900;font-size:26px}.pill{display:inline-block;padding:5px 9px;background:#eef6ff;border-radius:20px;margin:3px;font-size:12px}.ok{color:#147a45}.muted{color:#697586;line-height:1.8}</style></head><body>{% include 'header.html' %}<main class="wrap"><section class="hero"><h1>🧠 الذكاء المهني</h1><p>مؤشرات محلية قابلة للتدقيق مبنية على بيانات المنصة، وليست أحكامًا نهائية.</p></section><div class="grid"><section class="card"><h2>💰 ذكاء الرواتب</h2><div id="salary">جارٍ التحليل...</div></section><section class="card"><h2>🗺️ خارطة التطور المهني</h2><div id="roadmap">جارٍ التحليل...</div></section></div></main><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));async function load(){let r=await fetch('/api/ai/salary-intelligence'),d=await r.json();document.getElementById('salary').innerHTML=d.available?`<div class="score">${esc(d.average)} ${esc(d.currency)}</div><div class="muted">الوسيط: ${esc(d.median)} — النطاق: ${esc(d.min)} إلى ${esc(d.max)} — العينة: ${esc(d.sampleSize)}</div><p class="muted">${esc(d.disclaimer)}</p>`:`<div class="muted">${esc(d.message||'لا توجد بيانات كافية')}</div>`;r=await fetch('/api/ai/career-roadmap');d=await r.json();document.getElementById('roadmap').innerHTML=d.success?d.steps.map(x=>`<div class="item">${x.status==='completed'?'✅':'🎯'} <b>${esc(x.skill)}</b><div class="muted">${esc(x.reason)}</div></div>`).join(''):'<div class="muted">'+esc(d.message||'تعذر التحليل')+'</div>'}load();</script></body></html>
