<!DOCTYPE html>
<html lang="{{ site_lang|default("en") }}" dir="{{ site_dir|default("ltr") }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ trans('منصة التوظيف العربية') }}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/header.css" />
    <link rel="stylesheet" href="/static/css/ux-global.css" />
    <script src="/static/js/ux-global.js" defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7fc; color: #1a2a3a; direction: inherit; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .page-header { background: linear-gradient(135deg, #0d2b3e, #1a4a6e); color: #fff; padding: 70px 0; text-align: center; position: relative; overflow: hidden; }
        .page-header::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%); animation: pulse 8s ease-in-out infinite; }
        .page-header h1 { font-size: 42px; margin-bottom: 12px; position: relative; }
        .page-header p { font-size: 18px; opacity: 0.9; position: relative; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .page-content { background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin: 35px 0; }
        .page-content img { max-width: 100%; height: auto; border-radius: 10px; margin: 20px 0; }
        .page-content a { color: #1a4a6e; text-decoration: none; }
        .page-content a:hover { text-decoration: underline; }
        .page-content p { margin-bottom: 15px; }
        .page-content h2 { color: #1a4a6e; margin: 25px 0 15px; }
        .page-content h3 { color: #2c5282; margin: 20px 0 10px; }
        .page-content ul, .page-content ol { margin-right: 30px; margin-bottom: 15px; }
        .page-content li { margin-bottom: 8px; }
        .footer { background: linear-gradient(135deg, #0d2b3e, #1a4a6e); color: #b0c4d9; padding: 35px 0; margin-top: 50px; }
        .footer .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .footer-social a { color: #b0c4d9; margin: 0 12px; font-size: 22px; transition: all 0.3s ease; }
        .footer-social a:hover { color: #ffd700; transform: translateY(-3px); }
        @media (max-width: 768px) {
            .page-header { padding: 50px 0; }
            .page-header h1 { font-size: 32px; }
        }
        @media (max-width: 480px) {
            .page-header h1 { font-size: 26px; }
            .page-header p { font-size: 15px; }
        }
    </style>
    <style>.site-logo-white,.logo h1,.logo span{color:#fff!important;text-decoration:none}</style>
</head>
<body>
    <a class="ux-skip-link" href="#main-content">{{ trans('تجاوز إلى المحتوى') }}</a>
    <div id="notification" class="notification"></div>
    {% include 'header.html' %}
    <div class="page-header">
        <div class="container">
            <h1>{% block page_title %}{% endblock %}</h1>
            <p>{% block page_subtitle %}{% endblock %}</p>
        </div>
    </div>
    <div class="container" id="main-content" tabindex="-1">
        {% block content %}{% endblock %}
    </div>
    <footer class="footer">
        <div class="container">
            <p>© 2026 {{ trans('منصة التوظيف العربية') }} - {{ trans('جميع الحقوق محفوظة') }}</p>
            <div class="footer-social">
                <a href="#"><i class="fab fa-linkedin"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
    </footer>
</body>
</html>
