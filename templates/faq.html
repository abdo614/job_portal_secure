<!doctype html><html lang="{{ site_lang|default("en") }}" dir="{{ site_dir|default("ltr") }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأسئلة الشائعة</title><style>body{font-family:Tajawal,Arial,sans-serif;margin:0;background:#f5f7fa;color:#172333}.wrap{max-width:1100px;margin:auto;padding:35px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 20px #0001}.top{background:#102f45;color:#fff;padding:18px}.top a{color:#fff;margin-left:15px;text-decoration:none}</style><style>.site-logo-white,.logo h1,.logo span{color:#fff!important;text-decoration:none}</style><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/static/css/header.css">
</head><body>
{% include 'header.html' %}<main class="wrap"><h1>الأسئلة الشائعة</h1><div id="list"></div></main><script>(async function(){try{const r=await fetch('/api/content/faq');if(!r.ok)throw new Error('HTTP '+r.status+' '+r.statusText);const d=await r.json();const items=(Array.isArray(d)?d:[]).filter(x=>x&&x.enabled!==false);document.getElementById('list').innerHTML=items.map(x=>`<details class="card" style="margin:10px 0"><summary><strong>${x.title||x.name||''}</strong></summary><p>${x.content||x.description||''}</p></details>`).join('');if(!items.length){console.error('FAQ_EMPTY: لا توجد أسئلة شائعة مفعّلة في /api/content/faq');document.getElementById('list').innerHTML='<div class="card">لا توجد أسئلة شائعة منشورة حاليًا.</div>';}}catch(e){console.error('FAQ_LOAD_ERROR',e);document.getElementById('list').innerHTML='<div class="card">تعذر تحميل الأسئلة الشائعة.</div>';}})();</script>
</body></html>
