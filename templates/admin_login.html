<!DOCTYPE html>
<html lang="{{ site_lang|default('ar') }}" dir="{{ site_dir|default('rtl') }}">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>دخول الإدارة</title>
<style>
body{margin:0;font-family:Tajawal,Arial,sans-serif;background:linear-gradient(135deg,#0d2b3e,#1a4a6e);min-height:100vh;display:grid;place-items:center}
.card{width:min(420px,92%);background:#fff;border-radius:22px;padding:34px;box-shadow:0 25px 80px #0004}
h1{color:#123;margin-top:0}label{display:block;margin:14px 0 6px;font-weight:700}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#1a4a6e;color:#fff;font-weight:700;margin-top:20px;cursor:pointer}
#error{color:#c62828;margin-top:15px;display:none}.hint{color:#777;font-size:13px;margin-top:12px}
</style><style>.site-logo-white,.logo h1,.logo span{color:#fff!important;text-decoration:none}</style></head>
<body><div class="card">
<h1>لوحة تحكم المدير</h1>
<p>سجّل دخولك لإدارة الموقع بالكامل.</p>
<label>البريد الإلكتروني</label><input id="email" type="text" autocomplete="username" placeholder="example@email.com">
<label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password">
<button onclick="login()">دخول</button><div id="error"></div>
</div>
<script>
async function login(){
 const error=document.getElementById('error'); error.style.display='none';
 try{
  const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
   email:document.getElementById('email').value,password:document.getElementById('password').value
  })});
  const d=await r.json();
  if(d.success){location.href='/admin/dashboard';return;}
  error.textContent=d.message||'بيانات غير صحيحة';error.style.display='block';
 }catch(e){error.textContent='تعذر الاتصال بالخادم';error.style.display='block';}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
